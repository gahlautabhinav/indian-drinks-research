name: Deploy Fieldnotes to GitHub Pages

on:
  push:
    branches: [main]
    # Deploy only when the website shell or its assets change.
    # Research/data content is fetched by assets/app.js from raw.githubusercontent.com,
    # so ordinary archive commits do not need a new Pages deployment.
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
