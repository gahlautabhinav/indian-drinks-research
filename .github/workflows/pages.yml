name: Deploy Fieldnotes to GitHub Pages

on:
  push:
    branches: [main]
    # assets/app.js reads CSVs and dossiers from this same Pages site,
    # so data and research commits redeploy too.
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - "sources/**"
      - "research/**"
      - ".nojekyll"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
