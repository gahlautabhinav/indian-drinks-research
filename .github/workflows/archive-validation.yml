name: Archive data validation

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "sources/source_register.csv"
      - "scripts/validate_archive.py"
      - ".github/workflows/archive-validation.yml"
  pull_request:
    paths:
      - "data/**"
      - "sources/source_register.csv"
      - "scripts/validate_archive.py"
      - ".github/workflows/archive-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-csv-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSV structure and references
        run: python scripts/validate_archive.py
